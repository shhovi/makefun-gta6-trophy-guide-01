<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Fan-made GTA VI trophy tracker with 55 trophies, missable and spoiler filters, localStorage progress, and a six-step platinum roadmap.">
<title>Vice Trophy Guide — GTA VI trophy tracker & platinum roadmap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Vice Trophy Guide</h1>
<p class="subtitle">GTA VI trophy tracker & platinum roadmap</p>
<div class="progress-wrap">
<div id="progress-bar"><div id="progress-fill"></div></div>
<p id="progress-text">0 / 55 earned</p>
</div>
<nav class="filters" aria-label="Filters">
<button data-filter="all" class="active">All</button>
<button data-filter="missable">Missable</button>
<button data-filter="spoilers">Spoilers</button>
</nav>
</header>
<main>
<section id="tracker">
<h2>Trophy Tracker</h2>
<div id="trophy-list"></div>
</section>
<section id="roadmap">
<h2>Platinum Roadmap</h2>
<ol id="roadmap-list"></ol>
</section>
</main>
<footer>
<p>Fan-made guide for a fictional trophy list. Progress is saved locally in your browser.</p>
</footer>
<script type="module" src="src/main.js"></script>
</body>
</html>
